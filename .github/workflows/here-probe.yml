name: HERE probe

# Temporary: lists HERE route attributes; runs only when the probe script changes.
on:
  push:
    paths: [scripts/here_probe.py]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List HERE route attributes
        env:
          HERE_API_KEY: ${{ secrets.HERE_API_KEY }}
        run: python3 scripts/here_probe.py
