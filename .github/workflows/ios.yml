name: iOS build & test

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  overpass-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/overpass_probe.py

  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone')))")
          xcodebuild test \
            -project SpeedAnnounce.xcodeproj \
            -scheme SpeedAnnounce \
            -destination "id=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO

      - name: Screenshots
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone')))")
          xcodebuild build -project SpeedAnnounce.xcodeproj -scheme SpeedAnnounce \
            -destination "id=$DEVICE" -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE"
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryLevel 100 --cellularBars 4
          APP=$(find build/Build/Products -name "SpeedAnnounce.app" -maxdepth 2 | head -1)
          xcrun simctl install "$DEVICE" "$APP"
          mkdir -p screenshots
          for STATE in normal speeding; do
            xcrun simctl terminate "$DEVICE" dk.speedannounce.app || true
            xcrun simctl launch "$DEVICE" dk.speedannounce.app -demo $STATE
            sleep 6
            xcrun simctl io "$DEVICE" screenshot "screenshots/$STATE.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
      - name: Commit screenshots
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          # The generated project is committed so it can be opened without installing XcodeGen.
          git add screenshots SpeedAnnounce.xcodeproj SpeedAnnounce/Info.plist
          git diff --cached --quiet && exit 0
          git commit -m "Update screenshots and Xcode project [skip ci]"
          # A newer push may have moved the branch; screenshots are not worth failing the build over.
          git pull --rebase origin "$GITHUB_REF_NAME" && git push || echo "::warning::Could not push screenshots"
