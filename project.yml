name: SpeedAnnounce
options:
  bundleIdPrefix: dk.speedannounce
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SpeedAnnounce:
    type: application
    platform: iOS
    sources:
      - SpeedAnnounce
    info:
      path: SpeedAnnounce/Info.plist
      properties:
        CFBundleDisplayName: Fartgrænse
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location, audio]
        NSLocationWhenInUseUsageDescription: Appen bruger din position til at finde den aktuelle fartgrænse.
        NSLocationAlwaysAndWhenInUseUsageDescription: Appen bruger din position i baggrunden, så fartgrænser kan annonceres mens du kører med skærmen slukket.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.speedannounce.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  SpeedAnnounceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SpeedAnnounceTests
    dependencies:
      - target: SpeedAnnounce
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dk.speedannounce.tests
schemes:
  SpeedAnnounce:
    build:
      targets:
        SpeedAnnounce: all
        SpeedAnnounceTests: [test]
    test:
      targets: [SpeedAnnounceTests]
